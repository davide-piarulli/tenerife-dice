name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh data fetched at build time (AEMET beach forecasts, pharmacy rotas, news sitemap window).
    # Times in UTC: ~09:30 and ~15:30 in Canarias (winter).
    - cron: "30 9 * * *"
    - cron: "30 15 * * *"

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch pharmacy rotas (COF Tenerife)
        continue-on-error: true
        run: |
          pip install --quiet pymupdf==1.28.2
          python scripts/guardias.py

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}

      - name: Check build output
        run: node scripts/check-build.mjs

      - name: Publish out/ to hostinger-deploy branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: hostinger-deploy
          folder: out
          single-commit: true

      - name: Notify IndexNow (Bing / Copilot / ChatGPT search)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          sleep 60  # let Hostinger pull the new files so the key file is reachable
          node scripts/indexnow.mjs "${{ github.event.before }}" "${{ github.sha }}"

      - name: Alert on failure (Telegram via n8n)
        if: failure()
        run: |
          curl -s -m 20 -X POST "https://n8n.manistudio.es/webhook/td-deploy-alerta-k7p2m9" \
            -H "Content-Type: application/json" -H "X-TD-Token: td-gh-7Qm2Lx9Va4" \
            -d "{\"motivo\":\"${{ github.event_name }}\",\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
